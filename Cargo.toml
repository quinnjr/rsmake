[package]
name = "rsmake"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A make implementation for GNU-free base systems"
repository = "https://github.com/quinnjr/rsmake"

[[bin]]
name = "rsmake"
path = "src/main.rs"

[lib]
name = "rsmake"
path = "src/lib.rs"

# No dependencies, deliberately. make's command line mixes clustered flags with
# positional `VAR=value` assignments and bare goals, which fights every
# argument-parsing crate harder than the hundred lines it takes to write; and
# `$(wildcard)`'s pattern language is a single-directory-component subset that
# does not warrant a glob crate.

[profile.release]
lto = "thin"
